[workspace]
resolver = "2"
members = [
    "crates/loq-core",
    "crates/loq-cli",
    "crates/loq-helper",
    "crates/loq-powerd",
    "crates/loq-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RoyChong5053/LOQ-power"
authors = ["RoyChong5053"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
