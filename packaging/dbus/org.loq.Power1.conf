<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.loq.Power1"/>
    <allow send_destination="org.loq.Power1"/>
  </policy>

  <!-- Read-only access for local users; writes are gated by polkit inside
       the daemon, which checks every mutating method. -->
  <policy context="default">
    <allow send_destination="org.loq.Power1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.loq.Power1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.loq.Power1"
           send_interface="org.loq.Power1"/>
  </policy>

  <!-- Compatibility interface used by GNOME/KDE power widgets. -->
  <policy user="root">
    <allow own="net.hadess.PowerProfiles"/>
    <allow send_destination="net.hadess.PowerProfiles"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.hadess.PowerProfiles"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="net.hadess.PowerProfiles"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="net.hadess.PowerProfiles"
           send_interface="net.hadess.PowerProfiles"/>
  </policy>
</busconfig>
